spring:
  application:
    name: bank-access-management-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: 8080

app:
  security:
    tokens:
      access-token-ttl: 10m
      refresh-token-ttl: 30d

    jwt:
      secret-base64: "${BANK_ACCESS_JWT_SECRET:}"
      issuer: "${BANK_ACCESS_JWT_ISSUER:bank-access-management-backend}"
      audience: "${BANK_ACCESS_JWT_AUDIENCE:bank-access-management-api}"